name: Release

# Push a tag vX.Y.Z on master to publish com.yahoo.spatiari:spatiari:X.Y.Z to
# Maven Central and create the matching GitHub Release. The version comes from
# the tag; pom.xml on master stays at the next -SNAPSHOT (nothing is committed).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $TAG does not point at a commit on master"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check publishing secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$CENTRAL_USERNAME" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$CENTRAL_PASSWORD" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$GPG_KEY" ] || missing="$missing MAVEN_GPG_PRIVATE_KEY"
          [ -n "$GPG_PASSPHRASE" ] || missing="$missing MAVEN_GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"; exit 1
          fi

      - name: Set up JDK 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "8"
          # no dependency cache: a poisoned cache must not reach a signed release
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.17.1:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build, sign and publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -V clean deploy -Pcentral -DskipITs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes \
            --title "SPATIARI $TAG" \
            target/spatiari.jar target/spatiari-sources.jar target/spatiari-javadoc.jar
