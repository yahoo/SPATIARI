name: Release

# Push a tag vX.Y.Z on master to publish com.yahoo.spatiari:spatiari:X.Y.Z to
# GitHub Packages (and to Maven Central when the repository variable
# PUBLISH_TO_CENTRAL is "true"), then create the matching GitHub Release.
# The version comes from the tag; pom.xml on master stays at the next
# -SNAPSHOT (nothing is committed).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # deploy to GitHub Packages
    env:
      PUBLISH_TO_CENTRAL: ${{ vars.PUBLISH_TO_CENTRAL == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $TAG does not point at a commit on master"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # same timestamp in every build, so both deploys ship identical jars
          echo "timestamp=$(git log -1 --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Check publishing secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$GPG_KEY" ] || missing="$missing MAVEN_GPG_PRIVATE_KEY"
          [ -n "$GPG_PASSPHRASE" ] || missing="$missing MAVEN_GPG_PASSPHRASE"
          if [ "$PUBLISH_TO_CENTRAL" = true ]; then
            [ -n "$CENTRAL_USERNAME" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
            [ -n "$CENTRAL_PASSWORD" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"; exit 1
          fi

      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "8"
          # no dependency cache: a poisoned cache must not reach a signed release
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Write Maven settings
        # credentials are read from the environment of each deploy step;
        # the GPG passphrase comes from MAVEN_GPG_PASSPHRASE
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.17.1:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build, sign and publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          TIMESTAMP: ${{ steps.version.outputs.timestamp }}
        run: mvn -B -V clean deploy -Psign,github -DskipITs -Dproject.build.outputTimestamp="$TIMESTAMP"

      - name: Sign and publish to Maven Central
        if: env.PUBLISH_TO_CENTRAL == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          TIMESTAMP: ${{ steps.version.outputs.timestamp }}
        run: mvn -B clean deploy -Psign,central -DskipTests -Dproject.build.outputTimestamp="$TIMESTAMP"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes \
            --title "SPATIARI $TAG" \
            target/spatiari.jar target/spatiari-sources.jar target/spatiari-javadoc.jar
